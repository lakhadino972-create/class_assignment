<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dialysis Need Predictor</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <main class="container">
    <header>
      <h1>Dialysis Need Predictor</h1>
      <p class="sub">Enter lab values and history to estimate whether dialysis may be needed.</p>
    </header>

    <form id="form" novalidate>
      <div class="grid">
        <label>Age (years)
          <input type="number" name="Age" min="1" max="120" step="1" required />
        </label>
        <label>Creatinine (mg/dL)
          <input type="number" name="Creatinine_Level" min="0.1" max="20" step="0.01" required />
        </label>
        <label>BUN (mg/dL)
          <input type="number" name="BUN" min="1" max="200" step="0.1" required />
        </label>
        <label>GFR (mL/min/1.73m²)
          <input type="number" name="GFR" min="1" max="150" step="0.1" required />
        </label>
        <label>Urine output (mL/day)
          <input type="number" name="Urine_Output" min="0" max="6000" step="1" required />
        </label>
        <label>Diabetes
          <select name="Diabetes" required>
            <option value="0">No</option>
            <option value="1">Yes</option>
          </select>
        </label>
        <label>Hypertension
          <select name="Hypertension" required>
            <option value="0">No</option>
            <option value="1">Yes</option>
          </select>
        </label>
        <label>Chronic kidney disease (CKD)
          <select name="CKD_Status" required>
            <option value="0">No</option>
            <option value="1">Yes</option>
          </select>
        </label>
      </div>

      <div class="actions">
        <button type="submit" id="submit">Predict</button>
        <button type="button" id="fill" class="secondary">Fill example</button>
      </div>
    </form>

    <section id="result" class="result hidden" aria-live="polite">
      <div id="badge" class="badge"></div>
      <p id="headline"></p>
      <div class="bar"><div id="barFill"></div></div>
      <p id="details" class="details"></p>
    </section>

    <p id="error" class="error hidden"></p>

    <footer>
      <p class="disclaimer">
        Educational project only. This is not medical advice or a diagnosis.
        Always consult a qualified nephrologist for decisions about dialysis.
      </p>
    </footer>
  </main>
  <script src="/static/script.js"></script>
</body>
</html>
